services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phpcomrapadura_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/app.ini
    networks:
      - phpcomrapadura
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: phpcomrapadura_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - phpcomrapadura
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: phpcomrapadura_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-phpcomrapadura}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - phpcomrapadura

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpcomrapadura_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
    ports:
      - "8080:80"
    networks:
      - phpcomrapadura
    depends_on:
      - mysql

  redis:
    image: redis:7-alpine
    container_name: phpcomrapadura_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - phpcomrapadura

volumes:
  mysql_data:
  redis_data:

networks:
  phpcomrapadura:
    driver: bridge
